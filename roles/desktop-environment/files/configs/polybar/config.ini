[bar/mybar]
; override-redirect = true
; wm-restack = i3

bottom = true
; width = 99%
; offset-x = 0.5%
; offset-y = 6
; radius = 10
height = 28
background = #282828
foreground = #ebdbb2
font-0 = "FiraCode Nerd Font:style=Regular:pixelsize=12;2"
font-1 = "Noto Sans CJK JP:style=Regular:pixelsize=12"
modules-left = i3
modules-right = playerctl_mpv separator playerctl separator pulseaudio separator network separator cpu separator memory separator backlight separator battery separator date separator time

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
strip-wsnumbers = false

; workspace icon mapping (kept from your file)
ws-icon-0 = 2;
ws-icon-1 = 3;󰓇
ws-icon-2 = 4;
ws-icon-3 = 5;󰈹
ws-icon-4 = 6;
ws-icon-5 = 8;󰌾
ws-icon-6 = 1;
ws-icon-default = 

format = <label-state>
label-focused = %icon% %name%
label-focused-foreground = #bdd
# label-focused-background = #484848
label-focused-padding = 1

label-unfocused = %icon% %name%
# label-unfocused-foreground = #ababa2
label-unfocused-padding = 1

label-visible = %icon% %name%
# label-visible-foreground = #ffe1a6
label-visible-padding = 1

label-urgent = %icon% %name%
; label-urgent-background = #bf313a
label-urgent-foreground = #ff6666
label-urgent-padding = 1

[module/separator]
type = custom/text
content = ·

[module/playerctl_mpv]
type = custom/script
exec = ~/.local/bin/playerctl_mpv_status.sh
tail = true
interval = 1
format = <label>
label = %output%

click-left = playerctl -p mpv play-pause
click-right = bash -lc 'u=$(cat /tmp/ytwall.url 2>/dev/null || echo ""); [ -n "$u" ] && xdg-open "$u"'
scroll-up = ~/.local/bin/ytseek.sh +10
scroll-down = ~/.local/bin/ytseek.sh -10

[module/playerctl]
type = custom/script
tail = true
exec = ~/.config/polybar/playerctl.sh
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous
format-padding = 1
# format-background = #3a3a3a

[module/pulseaudio]
type = internal/pulseaudio
format-volume =   <label-volume>
label-volume = %percentage%%
label-muted = %{F#f30}󰝟 0%%{F-}
click-right = pavucontrol
format-volume-padding = 1
format-muted-padding  = 1
# format-volume-background = #282828
# format-muted-background  = #bf313a

[module/network]
type = internal/network
interface = wlo1
interval = 3
format-connected =   <label-connected>
label-connected = %local_ip%
format-disconnected =   offline
format-connected-padding    = 1
format-disconnected-padding = 1
# format-connected-background    = #3a3a3a
# format-disconnected-background = #3a3a3a

[module/cpu]
type = internal/cpu
interval = 2
format =   <label>
label = %percentage%%
format-padding = 1
# format-background = #282828

warn-percentage = 80
format-warn = %{F#ff3333}  <label-warn>%{F-}
label-warn = %percentage%%
format-warn-padding = 1

[module/memory]
type = internal/memory
interval = 5
format =   <label>
label = %used%/%total%
format-padding = 1
# format-background = #3a3a3a

warn-percentage = 80
format-warn = %{F#ff3333}  <label-warn>%{F-}
label-warn = %used%/%total%
format-warn-padding = 1

[module/backlight]
type = internal/backlight
card = amdgpu_bl1
format = 󱍖 <label>
label = %percentage%%
format-padding = 1
# format-background = #282828

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
low-at = 20

format-charging =   <label-charging>
format-discharging =   <label-discharging>
format-full = %{F#5b6} 100%%{F-}
format-low = %{F#ff3333}  <label-low>%{F-}

label-charging = %percentage%%
label-discharging = %percentage%%
label-low         = %percentage%%

format-charging-padding    = 1
format-discharging-padding = 1
format-full-padding        = 1
format-low-padding         = 1

# format-charging-background    = #3a3a3a
# format-discharging-background = #3a3a3a
# format-full-background        = #316f3a
# format-low-background         = #bf313a

[module/date]
type = internal/date
interval = 60
date = %a, %b %d %Y
label = %date%
format-padding = 1
# format-background = #282828

[module/time]
type = internal/date
interval = 1
time = %H:%M
label = %time%
format-padding = 1
# format-background = #3a3a3a
