---
- name: Download latest Neovim AppImage (x86_64)
  get_url:
    url: https://github.com/neovim/neovim-releases/releases/latest/download/nvim-linux-x86_64.appimage
    dest: /usr/local/bin/nvim.appimage
    mode: '0755'
    force: no

- name: Add nvim symlink
  file:
    src: /usr/local/bin/nvim.appimage
    dest: /usr/local/bin/nvim
    state: link
    force: yes

- name: Create Neovim config directory
  file:
    path: "/home/{{ main_user }}/.config/nvim"
    state: directory
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    mode: '0755'
  tags: [dev-tools, config]

- name: Clone or update kickstart.nvim to Neovim configuration directory
  git:
    repo: https://github.com/dawidbil/kickstart.nvim
    dest: "/home/{{ main_user }}/.config/nvim"
    version: master
    update: yes
    recursive: yes
  become_user: "{{ main_user }}"

- name: Ensure .local directory exists
  file:
    path: "/home/{{ main_user }}/.local"
    state: directory
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    mode: '0755'

- name: Ensure .local/bin directory exists
  file:
    path: "/home/{{ main_user }}/.local/bin"
    state: directory
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    mode: '0755'

- name: Download kitty installer script
  become: true
  get_url:
    url: https://sw.kovidgoyal.net/kitty/installer.sh
    dest: /tmp/kitty_installer.sh
    mode: '0755'
    force: no

- name: Install latest kitty using official script (run as user)
  become: true
  become_user: "{{ main_user }}"
  environment:
    HOME: "/home/{{ main_user }}"
  command: /bin/bash /tmp/kitty_installer.sh launch=n
  args:
    creates: "/home/{{ main_user }}/.local/kitty.app"

- name: Ensure kitty symlink exists in user's bin
  become: true
  file:
    src: "/home/{{ main_user }}/.local/kitty.app/bin/kitty"
    dest: "/home/{{ main_user }}/.local/bin/kitty"
    state: link
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    force: yes

- name: Ensure kitten symlink exists in user's bin (bundled with kitty)
  become: true
  file:
    src: "/home/{{ main_user }}/.local/kitty.app/bin/kitten"
    dest: "/home/{{ main_user }}/.local/bin/kitten"
    state: link
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    force: yes

- name: Create kitty config directory
  file:
    path: "/home/{{ main_user }}/.config/kitty"
    state: directory
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    mode: '0755'
  tags: [dev-tools, config]

- name: Copy kitty configuration
  copy:
    src: configs/kitty/
    dest: "/home/{{ main_user }}/.config/kitty/"
    owner: "{{ main_user }}"
    group: "{{ main_group }}"
    mode: '0644'
  tags: [dev-tools, config]

- name: Install zsh
  apt:
    name: zsh
    state: present

- name: Install oh-my-zsh for user (idempotent and non-interactive)
  become: true
  become_user: "{{ main_user }}"
  shell: |
    if [ ! -d "$HOME/.oh-my-zsh" ]; then
      sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" --unattended
    fi
  args:
    executable: /bin/bash
    creates: "/home/{{ main_user }}/.oh-my-zsh"
  environment:
    HOME: "/home/{{ main_user }}"
    CHSH: "no"
    RUNZSH: "no"
    KEEP_ZSHRC: "yes"

- name: Set default shell to zsh for user
  become: true
  user:
    name: "{{ main_user }}"
    shell: /usr/bin/zsh

- name: Ensure fonts directory exists
  file:
    path: /usr/local/share/fonts/nerd-fonts
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check if Fira Code fonts already installed (marker)
  stat:
    path: /usr/local/share/fonts/nerd-fonts/.fira_installed
  register: firacode_marker

- name: Download Fira Code Nerd Font zip
  get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip"
    dest: /tmp/FiraCode.zip
    force: no
  when: not firacode_marker.stat.exists

- name: Unzip Fira Code Nerd Font
  unarchive:
    src: /tmp/FiraCode.zip
    dest: /usr/local/share/fonts/nerd-fonts/
    remote_src: yes
  when: not firacode_marker.stat.exists
  register: firacode_unarchive

- name: Create marker file for Fira Code installation
  file:
    path: /usr/local/share/fonts/nerd-fonts/.fira_installed
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: not firacode_marker.stat.exists

- name: Update font cache
  command: fc-cache -fv
  when: not firacode_marker.stat.exists
